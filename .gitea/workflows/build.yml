name: Build

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  app:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host

      - name: Build and Push app image
        working-directory: app
        run: |
          docker build -t localhost:5000/sae-app:latest -f Dockerfile .
          docker push localhost:5000/sae-app:latest

  app-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        working-directory: app

      - name: Set package version
        run: npm pkg set version="${{ vars.version }}"
        working-directory: app

      - name: Build package
        run: npm run build:lib
        working-directory: app

      - name: Setup credentials
        run: |
          npm config set registry "https://${{ vars.package_url }}npm/"
          npm config set @super_crafting:registry "https://${{ vars.package_url }}npm/"
          npm config set -- "//${{ vars.package_url }}npm/:_authToken" "${{ secrets.PACKAGE_TOKEN }}"

      - name: Publish package
        run: npm publish --registry "https://${{ vars.package_url }}npm/"
        working-directory: app

  rest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker BuildX
        uses: docker/setup-buildx-action@v2
        with:
          buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host

      - name: Build and Push rest image
        working-directory: rest
        run: |
          docker build -t localhost:5000/sae-rest:latest -f Dockerfile .
          docker push localhost:5000/sae-rest:latest